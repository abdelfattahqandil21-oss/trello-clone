<button
  class="w-8 h-8 flex items-center justify-center rounded-lg text-text-secondary hover:bg-surface-hover hover:text-text-primary transition-all cursor-pointer border-none bg-transparent"
  (click)="toggle($event)"
  [attr.title]="themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
>
  @if (themeService.theme() === 'dark') {
    <i class="pi pi-sun"></i>
  } @else {
    <i class="pi pi-moon"></i>
  }
</button>
