<button
  class="flex items-center gap-2 px-3 py-2 rounded-lg text-text-secondary hover:bg-surface-hover transition-colors cursor-pointer border-none bg-transparent text-sm font-medium"
  (click)="toggle($event)"
>
  @if (themeService.theme() === 'dark') {
    <i class="pi pi-sun text-base text-warning"></i>
    <span>Light</span>
  } @else {
    <i class="pi pi-moon text-base text-brand-600"></i>
    <span>Dark</span>
  }
</button>
