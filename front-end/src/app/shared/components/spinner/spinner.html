@if (loadingService.isLoading()) {
  @if (inline()) {
    <div class="flex flex-col items-center justify-center py-12">
      <div class="w-10 h-10 border-4 border-gray-200 border-t-brand-500 rounded-full animate-spin"></div>
      <p class="mt-4 text-text-secondary text-sm font-medium animate-pulse">Loading...</p>
    </div>
  } @else {
    <div class="fixed inset-0 z-9999 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-16 h-16 border-4 border-gray-200 border-t-brand-500 rounded-full animate-spin"></div>
      <p class="mt-6 text-white text-lg font-bold tracking-wide animate-pulse">Loading...</p>
    </div>
  }
}
