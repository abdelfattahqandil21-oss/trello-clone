<div class="container">
  <h1>Weather Forecast</h1>

  @if (data(); as items) {
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>°C</th>
          <th>°F</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.date) {
          <tr>
            <td>{{ item.date }}</td>
            <td>{{ item.temperatureC }}</td>
            <td>{{ item.temperatureF }}</td>
            <td>{{ item.summary }}</td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="loading">Loading...</p>
  }
</div>
